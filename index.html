<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1">
<title>BINANCE:BTCUSDT — Fast</title>
<style>
html,body,#tv_chart_container{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#131722}
</style>
<script src="charting_library/charting_library.standalone.js"></script>
<script src="binance-fast-datafeed.js"></script>
</head>
<body>
<div id="tv_chart_container"></div>
<script>
(function(){
"use strict";

var datafeed = new BinanceFastDatafeed();
window.tvWidget = new TradingView.widget({
  fullscreen:true,
  autosize:true,
  symbol:"BINANCE:BTCUSDT",
  interval:"5",
  container:"tv_chart_container",
  datafeed:datafeed,
  library_path:"charting_library/",
  locale:"en",
  theme:"dark",
  timezone:"Etc/UTC",
  enabled_features:["study_templates","use_localstorage_for_settings"],
  overrides:{
    "mainSeriesProperties.style":1,
    "paneProperties.background":"#131722",
    "paneProperties.backgroundType":"solid",
    "scalesProperties.textColor":"#D1D4DC"
  }
});

// ======================================================================
// LOCAL CHART PERSISTENCE
// ======================================================================
var STORAGE_KEY = "btc-binance-chart-v1";
var restoreFinished = false;

function saveChartState() {
  if (!restoreFinished || !window.tvWidget) return;
  try {
    window.tvWidget.save(function(state) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
      catch (e) { console.warn("[Chart] Could not save chart state:", e); }
    });
  } catch (e) { console.warn("[Chart] Save failed:", e); }
}

function restoreChartState() {
  var raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  if (!raw) { restoreFinished = true; return; }
  try { window.tvWidget.load(JSON.parse(raw)); }
  catch (e) { console.warn("[Chart] Could not restore saved chart:", e); }
  setTimeout(function(){ restoreFinished = true; saveChartState(); }, 1500);
}

// ======================================================================
// 5m / 15m TARGET RAYS + AUTOMATIC 15m -> LAST-5m BOX
// Extracted from btc-chart-fullscreen_fast_binance_trade(4).html and
// recreated with TradingView Charting Library drawing objects.
// ======================================================================
var overlayState = {
  candles1m: [],
  bucket5: null,
  bucket15: null,
  target5: null,
  target15: null,
  ids: []
};

var BINANCE_1M_URL = "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=1000";
var FIVE = 5 * 60 * 1000;
var FIFTEEN = 15 * 60 * 1000;
var ONE = 60 * 1000;

function bucketStart(ts, size) { return Math.floor(ts / size) * size; }

function remember(id) {
  if (id !== null && id !== undefined) overlayState.ids.push(id);
  return id;
}

function removeAutoDrawings() {
  if (!window.tvWidget) return;
  var chart = window.tvWidget.activeChart();
  for (var i = 0; i < overlayState.ids.length; i++) {
    try { chart.removeEntity(overlayState.ids[i]); } catch (e) {}
  }
  overlayState.ids = [];
}

function find1mOpen(ts) {
  var a = overlayState.candles1m;
  for (var i = a.length - 1; i >= 0; i--) {
    if (a[i].t === ts) return a[i].o;
    if (a[i].t < ts) break;
  }
  return null;
}

function parse1mKlines(rows) {
  return rows.map(function(k){
    return { t:Number(k[0]), o:Number(k[1]), h:Number(k[2]), l:Number(k[3]), c:Number(k[4]) };
  });
}

async function refresh1mOverlayData() {
  try {
    var res = await fetch(BINANCE_1M_URL, { cache:"no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    overlayState.candles1m = parse1mKlines(await res.json());
    drawIntervalOverlays();
  } catch (e) {
    console.warn("[BTC overlay] 1m data refresh failed:", e);
  }
}

function addDashedRay(chart, startMs, price, color) {
  if (price == null) return;
  return remember(chart.createShape(
    { time: Math.floor(startMs / 1000), price: price },
    {
      shape: "horizontal_ray",
      lock: true,
      disableSelection: true,
      disableSave: true,
      disableUndo: true,
      overrides: {
        "linetoolhorzray.linecolor": color,
        "linetoolhorzray.linewidth": 1,
        "linetoolhorzray.linestyle": 2,
        "linetoolhorzray.extendLeft": false,
        "linetoolhorzray.extendRight": true,
        "linetoolhorzray.showLabel": false,
        "linetoolhorzray.showPriceLabels": false
      }
    }
  ));
}

function addDashedSegment(chart, t1, p1, t2, p2, color) {
  return remember(chart.createMultipointShape(
    [
      { time: Math.floor(t1 / 1000), price: p1 },
      { time: Math.floor(t2 / 1000), price: p2 }
    ],
    {
      shape: "trend_line",
      lock: true,
      disableSelection: true,
      disableSave: true,
      disableUndo: true,
      overrides: {
        "linetooltrendline.linecolor": color,
        "linetooltrendline.linewidth": 1,
        "linetooltrendline.linestyle": 2,
        "linetooltrendline.extendLeft": false,
        "linetooltrendline.extendRight": false,
        "linetooltrendline.showLabel": false,
        "linetooltrendline.showPriceLabels": false
      }
    }
  ));
}

function addAutoBox(chart, start15, p15, last5) {
  // Source behavior:
  // left  = 15m open - 1m
  // right = 15m end + 1m
  // top/bottom = 15m open and last-5m open
  // mid    = average of the two opens
  var left = start15 - ONE;
  var right = start15 + FIFTEEN + ONE;
  var top = Math.max(p15, last5);
  var bottom = Math.min(p15, last5);
  var mid = (p15 + last5) / 2;
  var boxColor = "#FFFFFF";

  addDashedSegment(chart, left, top, right, top, boxColor);
  addDashedSegment(chart, right, top, right, bottom, boxColor);
  addDashedSegment(chart, right, bottom, left, bottom, boxColor);
  addDashedSegment(chart, left, bottom, left, top, boxColor);
  addDashedSegment(chart, left, mid, right, mid, boxColor);
}

function drawIntervalOverlays() {
  if (!window.tvWidget || !overlayState.candles1m.length) return;

  var chart;
  try { chart = window.tvWidget.activeChart(); } catch (e) { return; }
  if (!chart) return;

  var now = Date.now();
  var start5 = bucketStart(now, FIVE);
  var start15 = bucketStart(now, FIFTEEN);
  var p5 = find1mOpen(start5);
  var p15 = find1mOpen(start15);

  overlayState.bucket5 = start5;
  overlayState.bucket15 = start15;
  overlayState.target5 = p5;
  overlayState.target15 = p15;

  removeAutoDrawings();

  // Both target rays are always visible from the beginning of their bucket.
  addDashedRay(chart, start15, p15, "#f5a623");
  addDashedRay(chart, start5, p5, "#7dd3fc");

  // Automatic box activates only after 10 minutes into the current 15m.
  if (p15 != null && now >= start15 + 10 * ONE) {
    var last5Start = start15 + 10 * ONE;
    var last5 = find1mOpen(last5Start);
    if (last5 != null) addAutoBox(chart, start15, p15, last5);
  }
}

window.tvWidget.onChartReady(function() {
  restoreChartState();

  // Wait for the chart/datafeed to be ready, then load the 1m source used
  // only for the interval-open calculations and automatic box.
  setTimeout(refresh1mOverlayData, 500);
  setInterval(refresh1mOverlayData, 10000);
  setInterval(drawIntervalOverlays, 5000);

  setInterval(saveChartState, 2000);
});

window.addEventListener("beforeunload", function(){ saveChartState(); });
})();
</script>
</body>
</html>
